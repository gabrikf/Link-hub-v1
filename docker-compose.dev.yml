# Development stack: Postgres, Redis and two optional tools behind the `tools`
# profile. `bash db-manage.sh start` brings up the first two; `bash db-manage.sh
# admin` adds the tools.
#
# NO `version:` KEY. Compose v2 ignores it and warns that it is obsolete on every
# single invocation; it was a v1 field and has meant nothing since 2020.

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: crafthub-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: crafthub_dev
      POSTGRES_USER: crafthub_user
      POSTGRES_PASSWORD: crafthub_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Named volume for data persistence
      - postgres_data:/var/lib/postgresql/data
      # Custom PostgreSQL config for better development performance
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c log_statement=all
      -c log_destination=stderr
      -c logging_collector=off
      -c log_min_duration_statement=0
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crafthub_user -d crafthub_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - crafthub-network

  redis:
    image: redis:7-alpine
    container_name: crafthub-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crafthub-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crafthub-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@crafthub.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crafthub-network
    profiles:
      - tools

  # -------------------------------------------------------------------------
  # mailpit — catches every e-mail the API sends, so you can actually SEE the
  # account-verification message instead of guessing.
  # -------------------------------------------------------------------------
  # DEVELOPMENT ONLY. It is in this file, never in docker-compose.prod.yml, and
  # it accepts any credentials and delivers nothing to the outside world — that
  # is the entire point, and it is also why it must never run in production.
  #
  # Without it there is no way to look at a verification e-mail locally. The API
  # falls back to MAIL_TRANSPORT=log and prints the link to the terminal, which
  # is fine for clicking through a flow but tells you nothing about whether the
  # message renders, whether the subject is right, or how it looks in a client.
  #
  # Behind the `tools` profile, like pgadmin: `docker compose -f
  # docker-compose.dev.yml up -d` does NOT start it, so nobody pays for a mail
  # catcher they are not using. `bash db-manage.sh admin` runs compose with
  # `--profile tools` and therefore starts it alongside pgAdmin.
  #
  #   Web UI  http://localhost:8025
  #   SMTP    localhost:1025 — no auth, no TLS
  #
  # The exact SMTP_* values to paste into apps/api/.env are in
  # DEVELOPMENT-GUIDE.md, under "Seeing the e-mails the API sends".
  #
  # No volume on purpose: messages live in memory and vanish on restart. A mail
  # catcher whose contents survive is a mail catcher full of last month's test
  # data.
  mailpit:
    image: axllent/mailpit:latest
    container_name: crafthub-mailpit-dev
    restart: unless-stopped
    environment:
      # Cap the mailbox so a runaway loop in a worker cannot eat the machine's
      # memory. Oldest messages are dropped first.
      MP_MAX_MESSAGES: 500
      # Accept whatever SMTP credentials the API sends, over a plain connection.
      # Mailpit refuses unauthenticated/insecure SMTP by default, and without
      # these two the API's SMTP_USER/SMTP_PASSWORD would have to be real — which
      # would mean configuring credentials for a server that throws mail away.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - crafthub-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  crafthub-network:
    driver: bridge
