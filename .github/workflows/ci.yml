name: CI

# Pull-request gate. Everything here runs against the code as it would be merged.
#
# Package manager is npm workspaces + Turborepo (`packageManager: npm@11.1.0`,
# a single `package-lock.json` at the root). Every job uses `npm ci` — never
# `npm install` — so the lockfile is authoritative and a drifted lockfile fails
# the build instead of being silently rewritten.

on:
  pull_request:
    # `develop` as well as `main`. Feature branches merge into `develop` here,
    # so a workflow that only watched `main` gave those pull requests no CI at
    # all — every "CI enforces this" claim in the docs was vacuous for exactly
    # the branches people actually open.
    branches: [main, develop]
  workflow_dispatch:

# A force-push to a PR branch should cancel the previous run rather than pay for
# CI on a commit nobody will merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # LINT — RECORDED BASELINE, NOT A GATE (yet)
  # ---------------------------------------------------------------------------
  #
  # SCOPE CHANGED 2026-09-04. `npm run lint` used to cover 238 of the repo's
  # ~800 TypeScript files: apps/web and packages/ui were the only workspaces
  # with a `lint` script. apps/api (476 files), apps/mcp, apps/extractor,
  # apps/training and packages/schemas had no ESLint config at all.
  #
  # All seven workspaces are now wired to `@repo/eslint-config`, which adds
  # `eslint-plugin-sonarjs` (SonarQube's own JS/TS analyzer rules, run locally)
  # and `eslint-plugin-n`. The baseline below counts findings across all of
  # them, so it is not comparable to the number that preceded it.
  #
  # `continue-on-error: true` is deliberate and it is NOT a way of pretending
  # the repo is clean.
  #
  # As of the commit that introduced this workflow, `npm run lint` reports
  # 30 pre-existing eslint errors in `apps/web`, essentially all of them
  # `react-hooks/set-state-in-effect` (new in eslint-plugin-react-hooks v7) and
  # `react-refresh/only-export-components`, plus one `no-control-regex` and one
  # unused `_params` argument. Clearing them means refactoring components that
  # work today, which is a separate piece of work with its own review.
  #
  # The three options were: (a) delete the lint check, (b) weaken the eslint
  # config until it passes, (c) run it, publish the number, and forbid it from
  # growing. This is (c). The eslint config is untouched. The count is printed
  # in the job log AND in the PR job summary on every single run, and the
  # ratchet step below fails the job the moment the count exceeds the baseline —
  # the job just does not block the merge queue while the debt is being paid.
  #
  # WHEN THE COUNT REACHES 0: drop `continue-on-error` and the ratchet, and let
  # `npm run lint` fail the job outright.
  lint:
    name: Lint (recorded baseline — non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      # The number of eslint errors that existed when this workflow was written.
      # This may only ever go DOWN. Lower it as violations are fixed.
      # This number is NOT comparable to the one before 2026-09-04. It was 30,
      # then 29, counting apps/web and packages/ui only — 238 of the repo's ~800
      # TypeScript files. All seven workspaces are now linted, with sonarjs and
      # the Node rules added, so the scope roughly quadrupled. 495 findings came
      # out of that; 75 remain. It may still only ever go DOWN from here.
      #
      # The root script is `turbo run lint --continue` for this step's sake:
      # without `--continue` turbo stops at the first failing workspace and the
      # count below is silently partial — it read 1 instead of 73 the first time
      # this ran with seven workspaces.
      LINT_ERROR_BASELINE: "67"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        id: eslint
        run: |
          set -o pipefail
          # `|| true` so the count below is always computed; the ratchet step is
          # what decides pass/fail.
          npm run lint 2>&1 | tee lint-output.txt || true

      - name: Count violations and enforce the ratchet
        run: |
          # eslint's stylish formatter ends each workspace with a summary line
          # like "✖ 30 problems (30 errors, 0 warnings)". Turborepo prefixes
          # every line with "web:lint: ", so match anywhere on the line and sum
          # across workspaces.
          ERRORS=$(grep -oE '[0-9]+ errors?' lint-output.txt \
            | grep -oE '^[0-9]+' \
            | awk '{ total += $1 } END { print total + 0 }')

          BASELINE="${LINT_ERROR_BASELINE}"

          echo "================================================================"
          echo " ESLINT BASELINE REPORT"
          echo "----------------------------------------------------------------"
          echo " current errors : ${ERRORS}"
          echo " baseline       : ${BASELINE}"
          echo "================================================================"

          {
            echo "### ESLint baseline"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Current errors | \`${ERRORS}\` |"
            echo "| Recorded baseline | \`${BASELINE}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ERRORS" -gt "$BASELINE" ]; then
            echo "::error::This PR adds $((ERRORS - BASELINE)) new eslint error(s) on top of the ${BASELINE} pre-existing ones. Fix the new violations."
            echo "This PR **adds $((ERRORS - BASELINE)) new eslint error(s)** on top of the recorded baseline. Fix the new violations." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$ERRORS" -lt "$BASELINE" ]; then
            echo "::notice::Lint debt went down by $((BASELINE - ERRORS)). Lower LINT_ERROR_BASELINE in .github/workflows/ci.yml to ${ERRORS} to lock the improvement in."
            echo "Lint debt went **down by $((BASELINE - ERRORS))**. Lower \`LINT_ERROR_BASELINE\` in \`.github/workflows/ci.yml\` to \`${ERRORS}\` to lock this in." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning::${ERRORS} pre-existing eslint errors remain (unchanged). These are technical debt and must be burned down; see the comment at the top of .github/workflows/ci.yml."
          echo "${ERRORS} pre-existing eslint errors remain. This is recorded technical debt that must be burned down." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # TYPE CHECK — a real gate
  # ---------------------------------------------------------------------------
  #
  # `turbo run check-types` now covers apps/api and apps/web as well as the
  # packages; both app-level `check-types` scripts were added alongside this
  # workflow, so this job is the first time those two are type-checked in CI.
  check-types:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check all workspaces
        run: npm run check-types

  # ---------------------------------------------------------------------------
  # HARNESS — the agent instructions, checked like code
  # ---------------------------------------------------------------------------
  #
  # AGENTS.md, the nested workspace files and the skills are loaded as
  # instructions by Claude Code, Cursor, Codex and Kiro. Nothing else in this
  # workflow reads them, so a rule that cites a file somebody renamed stays
  # "true" until an agent goes looking and improvises instead. This job is the
  # same check the pre-push gate runs, plus the sensor's own self-test — a
  # check nobody has seen fire is indistinguishable from one that cannot.
  #
  # No dependencies, no build: it is node and the repo, and it finishes in
  # under a second.
  harness:
    name: Harness (cites, budgets, skills)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prove the sensor still bites
        run: node scripts/guardrails/harness-check.mjs --self-test

      - name: Check the harness
        run: node scripts/guardrails/harness-check.mjs

      - name: Prove the palette check still bites
        run: node scripts/guardrails/design-tokens.mjs --self-test

      - name: Check the palette
        run: node scripts/guardrails/design-tokens.mjs

  # ---------------------------------------------------------------------------
  # LINT RATCHET — the gate that actually blocks
  # ---------------------------------------------------------------------------
  #
  # The `lint` job above counts findings and does not block. THIS one blocks,
  # and it asks a different question: not "is the repo clean" but "did this
  # pull request add anything".
  #
  # It lints the changed files with `eslint.typed.config.js` — the syntactic
  # rules plus the type-aware ones (`no-unsafe-*`, `no-floating-promises`) —
  # and compares each file+rule count against
  # `scripts/guardrails/lint-baseline.json`. A finding already recorded there is
  # inherited debt and passes. One that is not, fails.
  #
  # `fetch-depth: 0` because the ratchet diffs against the merge-base, and a
  # shallow clone has no merge-base to find.
  lint-ratchet:
    name: Lint ratchet (new findings only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The type-aware rules need @repo/schemas' emitted types to resolve, the
      # same reason check-types and test both depend on ^build.
      - name: Build shared packages
        run: npm run build:schemas

      # `github.base_ref` is empty on a workflow_dispatch run, which would make
      # this `--base origin/` and fail. Passing no `--base` lets the script fall
      # back to its own merge-base resolution, which is the right answer when
      # there is no pull request to compare against.
      # A deleted test turns a suite red; a deleted eslint rule turns lint
      # GREEN. Two sensors were lost exactly that way during this rollout, and
      # nothing said so. This asserts each one still fires on a probe and stays
      # quiet on a control.
      - name: Prove the eslint sensors still bite
        run: node scripts/guardrails/lint-sensors-self-test.mjs

      - name: Lint the changed files against the ratchet
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            node scripts/guardrails/lint-changed.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/guardrails/lint-changed.mjs
          fi

  # ---------------------------------------------------------------------------
  # TEST — a real gate, against real Postgres + Redis
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      # pgvector, not plain postgres: migration 0006 runs `CREATE EXTENSION
      # vector` and the resume-embedding tables use the `vector` column type.
      # Pinned to pg15 to match docker-compose.dev.yml and production.
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: crafthub_test
          POSTGRES_USER: crafthub_user
          POSTGRES_PASSWORD: crafthub_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crafthub_user -d crafthub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crafthub_user:crafthub_password@localhost:5432/crafthub_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      # No OPENAI_API_KEY. See the "Declare the excluded tests" step below.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # apps/api imports `@repo/schemas` from its built `dist/`. Turborepo's
      # `test` task declares `dependsOn: ["^build"]` for exactly this reason;
      # the api suite is invoked directly below (to pass vitest flags), so the
      # dependency has to be satisfied explicitly.
      - name: Build shared packages
        run: npm run build:schemas

      - name: Apply database migrations
        run: npm run db:migrate --workspace=api

      # ---------------------------------------------------------------------
      # HONESTY STEP. A narrowed test run that looks green is worse than one
      # that says what it did not run, so the exclusions are printed in full,
      # by name, with the reason, on every single CI run.
      # ---------------------------------------------------------------------
      - name: Declare the excluded tests
        run: |
          echo "================================================================"
          echo " TEST SCOPE NOTICE — the following files are NOT run in CI"
          echo "----------------------------------------------------------------"
          echo " apps/api/src/infra/http/controllers/resume/test/search.e2e.test.ts"
          echo " apps/api/src/infra/http/controllers/resume/test/search-boundaries.e2e.test.ts"
          echo " apps/api/src/infra/database/drizzle/search-indexes.e2e.test.ts"
          echo ""
          echo " WHY: these three call the live OpenAI API to produce real"
          echo " embeddings, so they need a funded OPENAI_API_KEY. A real key is"
          echo " deliberately NOT available to pull-request CI — PRs from forks"
          echo " would expose it, and every run would spend money."
          echo ""
          echo " CONSEQUENCE: semantic-search relevance and the pgvector index"
          echo " behaviour are NOT covered by this run. Run them locally with a"
          echo " key before shipping changes to resume search or the embedding"
          echo " pipeline:"
          echo "   npm run test --workspace=api -- src/infra/http/controllers/resume/test"
          echo ""
          echo " Every other test, including the hermetic e2e suites built on"
          echo " build-test-app.ts, DOES run below."
          echo "================================================================"
          {
            echo "### Tests skipped in CI"
            echo ""
            echo "These three files need a live \`OPENAI_API_KEY\` and are **not** covered by this run:"
            echo ""
            echo "- \`apps/api/src/infra/http/controllers/resume/test/search.e2e.test.ts\`"
            echo "- \`apps/api/src/infra/http/controllers/resume/test/search-boundaries.e2e.test.ts\`"
            echo "- \`apps/api/src/infra/database/drizzle/search-indexes.e2e.test.ts\`"
            echo ""
            echo "Semantic-search relevance and pgvector index behaviour are therefore unverified by CI."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE ON `--exclude`: vitest's CLI `--exclude` REPLACES `test.exclude`
      # rather than adding to it, so the two defaults we care about
      # (`**/node_modules/**`, `**/dist/**`) have to be repeated here. Dropping
      # them would make vitest collect test files out of node_modules.
      - name: Test — api (OpenAI-dependent e2e excluded)
        working-directory: apps/api
        run: |
          npx vitest run \
            --exclude '**/node_modules/**' \
            --exclude '**/dist/**' \
            --exclude 'src/infra/http/controllers/resume/test/search.e2e.test.ts' \
            --exclude 'src/infra/http/controllers/resume/test/search-boundaries.e2e.test.ts' \
            --exclude 'src/infra/database/drizzle/search-indexes.e2e.test.ts'

      - name: Test — every other workspace
        run: npx turbo run test '--filter=!api'
