<svg
  viewBox="0 0 32 32"
  width="32"
  height="32"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!--
    The LinkHub mark, kept byte-for-byte in step with the BrandLogo component
    (src/shared-components/brand-logo.tsx). The tile carries its own violet
    background on purpose: a transparent mark would disappear against a dark
    browser tab strip, and this way one file serves both themes.
  -->
  <defs>
    <linearGradient
      id="linkhub-brand-gradient"
      x1="0"
      y1="0"
      x2="32"
      y2="32"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#7C3AED" />
      <stop offset="1" stop-color="#5B21B6" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8.5" fill="url(#linkhub-brand-gradient)" />

  <!-- connections -->
  <g stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" opacity="0.92">
    <line x1="16" y1="16" x2="16" y2="8" />
    <line x1="16" y1="16" x2="9" y2="23" />
    <line x1="16" y1="16" x2="23" y2="23" />
  </g>

  <!-- nodes -->
  <g fill="#FFFFFF">
    <circle cx="16" cy="16" r="3.1" />
    <circle cx="16" cy="8" r="2.3" />
    <circle cx="9" cy="23" r="2.3" />
    <circle cx="23" cy="23" r="2.3" />
  </g>
</svg>
